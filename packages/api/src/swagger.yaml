openapi: 3.0.3
info:
  title: Crew Ledger API
  description: >
    Mock API for the payout ledger. Backed by JSON files generated by
    `pnpm run create-data`. Reads are behind a replica that jitters and
    sometimes gives up.
  version: 1.0.0
servers:
  - url: http://localhost:3000
tags:
  - name: auth
  - name: crew
  - name: jobs
paths:
  /login:
    post:
      tags: [auth]
      summary: Exchange an email and password for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: gandalf.the.grey@test.com
                password:
                  type: string
                  example: 123code
      responses:
        '200':
          description: A signed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Incorrect login or password
  /crew:
    get:
      tags: [crew]
      summary: The front company for the logged-in member's crew
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One crew
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '503':
          description: Replica unavailable
  /crew-members:
    get:
      tags: [crew]
      summary: Members of the logged-in member's crew
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of crew members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrewMember'
        '503':
          description: Replica unavailable
  /jobs:
    get:
      tags: [jobs]
      summary: Jobs for the logged-in member's crew
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [CASING, RUNNING, SCORED, BURNED, SEIZED]
        - in: query
          name: plannerId
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A page of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
                      status:
                        type: string
                        nullable: true
                      plannerId:
                        type: string
                        nullable: true
                      crewId:
                        type: string
        '503':
          description: Replica unavailable
  /jobs/{id}:
    get:
      tags: [jobs]
      summary: One job, if it belongs to the caller's crew
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: One job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job not found
        '503':
          description: Replica unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Crew:
      type: object
      properties:
        id:
          type: string
        legalName:
          type: string
          example: Fellowship Logistics GmbH
        frontBusiness:
          type: string
          example: REMOVALS
    CrewMember:
      type: object
      properties:
        id:
          type: string
        crewId:
          type: string
        name:
          type: string
          example: Gandalf the Grey
        alias:
          type: string
        role:
          type: string
          example: PLANNER
        standing:
          type: string
          enum: [ACTIVE, IN_CUSTODY, RETIRED]
        email:
          type: string
        profileImage:
          type: string
    Job:
      type: object
      properties:
        id:
          type: string
        crewId:
          type: string
        plannerId:
          type: string
        codename:
          type: string
          example: SILVERWARE
        targetName:
          type: string
        targetIconUrl:
          type: string
        city:
          type: string
        status:
          type: string
          enum: [CASING, RUNNING, SCORED, BURNED, SEIZED]
        jobTime:
          type: string
          format: date-time
        takings:
          type: array
          description: >
            Heterogeneous. Each entry is discriminated by `assetType` and carries
            the fields that asset type happens to have. Entries are stored the way
            they were written down after the job.
          items:
            type: object
        expenses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              amount:
                type: string
              currency:
                type: string
                enum: [EUR, USD]
              frontedBy:
                type: string
                nullable: true
        cuts:
          type: array
          items:
            type: object
            properties:
              crewMemberId:
                type: string
              kind:
                type: string
                enum: [PERCENT, FLAT]
              percent:
                type: string
                nullable: true
              amount:
                type: string
                nullable: true
              currency:
                type: string
                nullable: true
              note:
                type: string
                nullable: true
        expensePolicy:
          type: string
          nullable: true
          enum: [OFF_THE_TOP, FROM_SHARES, PAID_BY_FRONTER]
        fenceFeePercent:
          type: string
          example: '12.5'
        failureNote:
          type: string
          nullable: true
